<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="Terra Classic Community" />
  <meta name="application-name" content="Terra Classic" />
  <meta name="apple-mobile-web-app-title" content="Terra Classic" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
  <link rel="icon" href="/favicon.ico" sizes="256x256" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <!-- Preconnect to external domains -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Preload critical resources -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  </noscript>
  <!-- Inline critical CSS -->
  <style id="critical-css">
    /* Critical CSS will be inlined here */
    body { margin: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    #root { min-height: 100vh; display: flex; flex-direction: column; }
  </style>
  <!-- SSR: Head tags will be injected here by the server -->
  <!-- SSR_HEAD -->
</head>
<body class="bg-gray-50 text-gray-800 antialiased">
  <!-- SSR: App content will be injected here -->
  <div id="root"><!-- SSR_APP --></div>
  
  <!-- Initial state will be injected here by the server -->
  <script id="__INITIAL_STATE__" type="application/json"><!-- SSR_STATE --></script>
  
  <!-- Load the app -->
  <script type="module" src="/src/main.tsx"></script>
  
  <!-- Load non-critical CSS asynchronously -->
  <script>
    // Load non-critical CSS
    function loadCSS(href, before, media, attributes) {
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = href;
      if (media) link.media = media;
      if (attributes) {
        Object.keys(attributes).forEach(key => {
          link.setAttribute(key, attributes[key]);
        });
      }
      document.head.appendChild(link);
    }
    
    // Load non-critical CSS after page load
    window.addEventListener('load', function() {
      // Load any additional stylesheets here
    });
  </script>
  
</body>
</html>
